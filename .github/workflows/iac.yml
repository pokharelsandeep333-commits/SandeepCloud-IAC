# Static checks for the Terraform in this repo. No AWS credentials, no plan,
# never apply: Sandeep runs plan/apply locally.
#
# Every action is pinned to a full commit SHA (version in the comment), and
# every action release was at least a week old when pinned. The tool versions
# match the ones run locally, and the Trivy and gitleaks binaries are checked
# against SHA-256 hashes written here, not ones fetched at run time.

name: 🏗️ IaC checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer run on the same branch makes the older one moot: every run scans the
# whole tree and gitleaks scans the whole history. (A literal true here, not an
# expression: Checkov's workflow schema rejects one and then skips the file.)
concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TERRAFORM_VERSION: "1.16.6"
  TFLINT_VERSION: "v0.65.0"
  CHECKOV_VERSION: "3.3.30"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: 🎨 Format · Validate · Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧰 Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: 🎨 terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      # Each root module, without a backend: CI has no AWS access and never reads state.
      - name: ✅ terraform validate
        id: validate
        if: ${{ !cancelled() }}
        run: |
          for dir in bootstrap envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: 🧰 Set up TFLint
        if: ${{ !cancelled() }}
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # The token only raises the API rate limit for the plugin download.
      - name: 🔍 TFLint
        id: tflint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: 📝 Summary
        if: ${{ !cancelled() }}
        env:
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TFLINT: ${{ steps.tflint.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed" ;; failure) echo "❌ failed" ;; *) echo "⏭️ $1" ;; esac; }
          {
            echo "## 🎨 Format · Validate · Lint"
            echo
            echo "| Check | Scope | Result |"
            echo "|---|---|---|"
            echo "| 🎨 \`terraform fmt\` | whole repo | $(icon "$FMT") |"
            echo "| ✅ \`terraform validate\` | \`bootstrap\`, \`envs/prod\` | $(icon "$VALIDATE") |"
            echo "| 🔍 TFLint + AWS ruleset | every module | $(icon "$TFLINT") |"
            echo
            echo "<sub>Terraform $TERRAFORM_VERSION · TFLint $TFLINT_VERSION</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: 🛡️ Security scan · Checkov + Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 📦 Install Checkov
        run: python -m pip install --disable-pip-version-check "checkov==$CHECKOV_VERSION"

      # Both scanners always write their SARIF and never stop the job themselves,
      # so the upload and summary still happen when something is found. The
      # gate step at the end fails the build on any finding.
      - name: 🛡️ Checkov
        run: |
          checkov --directory . --framework terraform github_actions \
            --download-external-modules false --soft-fail \
            --output cli --output sarif --output-file-path console,checkov.sarif

      # Checkov keeps inline-skipped checks in its SARIF (marked as suppressed),
      # and code scanning opens them as alerts anyway. The #checkov:skip line and
      # its reason are the record of an accepted risk, so they don't upload.
      - name: 🧹 Drop skipped checks from the Checkov SARIF
        run: |
          python - <<'EOF'
          import json
          path = "checkov.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          dropped = 0
          for run in sarif["runs"]:
              kept = [r for r in run["results"] if not r.get("suppressions")]
              dropped += len(run["results"]) - len(kept)
              run["results"] = kept
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print(f"Dropped {dropped} suppressed result(s) from {path}")
          with open("checkov-skipped.txt", "w", encoding="utf-8") as f:
              f.write(str(dropped))
          EOF

      - name: 📦 Install Trivy
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 🔎 Trivy
        run: |
          trivy config --exit-code 0 .
          trivy config --quiet --exit-code 0 --format sarif --output trivy.sarif .

      # A fork's token can't write security events, so only upload for this repo's own branches.
      - name: 📤 Upload Checkov results to code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: 📤 Upload Trivy results to code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: 📝 Summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, os

          def results(path):
              if not os.path.exists(path):
                  return None
              with open(path, encoding="utf-8") as f:
                  return [r for run in json.load(f)["runs"] for r in run["results"]]

          skipped = open("checkov-skipped.txt").read() if os.path.exists("checkov-skipped.txt") else "?"
          tools = [("🛡️ Checkov", results("checkov.sarif")), ("🔎 Trivy", results("trivy.sarif"))]

          print("## 🛡️ Security scan")
          print()
          print("| Scanner | Findings | Rules | Skipped inline |")
          print("|---|---:|---:|---:|")
          for name, res in tools:
              if res is None:
                  print(f"| {name} | ⚠️ no results file | | |")
              else:
                  rules = len({r["ruleId"] for r in res})
                  print(f"| {name} | {len(res)} | {rules} | {skipped if 'Checkov' in name else '–'} |")
          print()
          total = sum(len(res or []) for _, res in tools)
          if total == 0 and all(res is not None for _, res in tools):
              print("> 🚦 **Gate passed.** No open findings. Accepted risks are skipped in code with a reason "
                    "and listed in the README.")
          else:
              print("> 🚦 **Gate failed.** Any finding fails the build: fix it, or skip it in code "
                    "with a reason and add it to the README's accepted-risk table.")
          for name, res in tools:
              if not res:
                  continue
              print()
              print(f"<details><summary>{name}: findings by rule</summary>")
              print()
              print("| Rule | Count |")
              print("|---|---:|")
              for rule, n in collections.Counter(r["ruleId"] for r in res).most_common():
                  print(f"| `{rule}` | {n} |")
              print()
              print("</details>")
          print()
          print(f"<sub>Checkov {os.environ['CHECKOV_VERSION']} · Trivy {os.environ['TRIVY_VERSION']} · "
                "full detail in the Security tab → Code scanning</sub>")
          EOF

      # Counts what's left after inline skips, from the same SARIF that was uploaded.
      - name: 🚦 Gate (fail on any finding)
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import json, os, sys

          def esc(text):  # workflow-command escaping; Trivy's messages span several lines
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          failed = False
          for path in ("checkov.sarif", "trivy.sarif"):
              if not os.path.exists(path):
                  print(f"::error::{path} is missing, so the scan didn't finish")
                  failed = True
                  continue
              with open(path, encoding="utf-8") as f:
                  results = [r for run in json.load(f)["runs"] for r in run["results"]]
              for r in results:
                  loc = r.get("locations", [{}])[0].get("physicalLocation", {})
                  file = loc.get("artifactLocation", {}).get("uri", "?")
                  line = loc.get("region", {}).get("startLine", 1)
                  print(f"::error file={file},line={line}::{esc(r['ruleId'] + ': ' + r['message']['text'])}")
              print(f"{path}: {len(results)} finding(s)")
              failed = failed or bool(results)
          sys.exit(1 if failed else 0)
          EOF

  gitleaks:
    name: 🔐 Secret scan · gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: a secret that was ever committed counts, even if a later commit removed it.
      - name: 📥 Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Fails the job on any finding; --redact keeps the secret itself out of the log.
      - name: 🔐 gitleaks
        id: gitleaks
        run: gitleaks git --redact --no-banner --verbose .

      - name: 📝 Summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          commits=$(git rev-list --count HEAD)
          case "$OUTCOME" in
            success) result="✅ No secrets found" ;;
            failure) result="❌ Possible secret found. See the gitleaks step log (values are redacted)" ;;
            *)       result="⏭️ $OUTCOME" ;;
          esac
          {
            echo "## 🔐 Secret scan"
            echo
            echo "| Scope | Result |"
            echo "|---|---|"
            echo "| 📜 Full git history, $commits commits | $result |"
            echo
            echo "<sub>gitleaks $GITLEAKS_VERSION</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
