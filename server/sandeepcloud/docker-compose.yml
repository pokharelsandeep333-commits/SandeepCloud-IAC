# Hardened 2026-10-06 (audit M1/M2/M3/H4). Previous version: pre-hardening-2026-10-06/docker-compose.yml
#   frontend = reachable by nginx + internet egress; backend = internal only (db, redis)
x-hardening: &hardening
  restart: always
  security_opt:
    - no-new-privileges:true
  pids_limit: 200

services:
  nextcloud:
    <<: *hardening
    image: nextcloud:35-apache          # pinned major; was :latest
    container_name: sandeepcloud_nextcloud_1
    pids_limit: 300
    mem_limit: 512m
    volumes:
      - sandeepcloud_data:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks: [frontend, backend]
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 60s
      timeout: 10s
      retries: 3

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    mem_limit: 128m
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    <<: *hardening
    image: mariadb:10.11
    container_name: sandeepcloud_db_1
    pids_limit: 300
    mem_limit: 512m
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_ROOT_HOST=localhost     # root only from inside the container
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  portfolio_app:
    <<: *hardening
    image: pokharelsandeep333/my-portfolio-app:latest
    container_name: sandeepcloud_portfolio
    mem_limit: 128m
    expose:
      - "80"
    env_file:
      - /home/ubuntu/portfolio/.env
    networks: [frontend]

  arc-vault:
    <<: *hardening
    image: pokharelsandeep333/molecular-zettelkasten:latest
    container_name: arc-vault
    mem_limit: 256m
    expose:
      - "3000"
    env_file:
      - /home/ubuntu/Molecular-Zettelkasten/ec2-deployment/.env
    environment:
      - VAULT_PATH=/app/vault
      - SMART_ENV_PATH=/app/vault/.smart-env/multi
    volumes:
      - /home/ubuntu/Molecular-Zettelkasten/ec2-deployment/LLM-Wiki:/app/vault:ro
    networks: [frontend]

  nginx:
    <<: *hardening
    image: nginx:1.31                   # pinned; was :latest
    container_name: sandeepcloud_nginx_1
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - /var/log/sandeepcloud-nginx:/var/log/nginx-wazuh
    networks: [frontend]
    depends_on:
      - nextcloud
      - portfolio_app
      - arc-vault
      - shiftsentry

  watchtower:
    <<: *hardening
    # Maintained fork (containrrr/watchtower was archived Dec 2025). Pinned by digest.
    image: nickfedor/watchtower:1.22.3@sha256:2f8f2a9bd21a195b3b650409532a20f6aada8ef5834f00d0d7a999dee0779a81
    container_name: sandeepcloud_watchtower
    mem_limit: 64m
    environment:
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/sandeepcloud/watchtower/config:/config:ro
    networks: [frontend]
    command: --interval 300 --cleanup sandeepcloud_portfolio arc-vault sandeepcloud_shiftsentry

  shiftsentry:
    <<: *hardening
    image: docker.io/pokharelsandeep333/shiftsentry:stable
    container_name: sandeepcloud_shiftsentry
    mem_limit: 384m
    expose:
      - "3000"
    env_file:
      - /home/ubuntu/ShiftSentry/.env.production
    networks: [frontend]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  sandeepcloud_data:
  db_data:
