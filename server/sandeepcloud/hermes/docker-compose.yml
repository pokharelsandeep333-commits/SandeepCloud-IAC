# Hermes agent. On the live server this container was started with `docker run`
# (2026-10-06), not compose. This file is rebuilt from `docker inspect hermes`
# on 2026-10-25 so a new server can start it the same way.
# Its config and API keys live in /home/ubuntu/.hermes, which goes in the
# encrypted backup, never in this repo.
services:
  hermes:
    # The live container runs the untagged image (:latest), this digest as of 2026-10-25.
    image: nousresearch/hermes-agent@sha256:6846d14ded07433cb81ba81a8ee91a9581604c8fdfd8480196d142f4dc74dcd2
    container_name: hermes
    restart: unless-stopped
    command: ["hermes", "gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    network_mode: bridge
