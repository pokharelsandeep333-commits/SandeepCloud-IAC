# The Wazuh manager is reached over Tailscale. At boot, wazuh-agent used to start ~3 s before
# tailscaled had installed its routes, so the first connect went out eth0, got no answer and hung
# ~2 min 16 s before the retry worked (agent "Disconnected" after every laptop reboot).
# Wait for tailscale0 to have an IPv4 address and for Tailscale's routing table (52) to have
# routes, up to 120 s. If the tailnet never comes up, start anyway (same as before this file).
# "$$" is a literal "$" for the shell (systemd expands a single "$" itself).
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$$i" -lt 60 ]; do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q inet && ip route show table 52 2>/dev/null | grep -q tailscale0 && exit 0; i=$$((i+1)); sleep 2; done; echo "tailnet not up after 120 s; starting the agent anyway"; exit 0'
TimeoutStartSec=180
