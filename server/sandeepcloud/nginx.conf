resolver 127.0.0.11 valid=10s;

# Copy of the access log for the Wazuh agent (host: /var/log/sandeepcloud-nginx, rotated by logrotate). Added 2026-10-09.
access_log /var/log/nginx-wazuh/access.log combined;

# --- Real client IPs from Cloudflare (origin only accepts CF via the AWS Security Group) ---
# Ranges: https://www.cloudflare.com/ips/  (re-check every few months)
set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;  set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;   set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;   set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Hide versions ---
server_tokens off;

# --- Login brute-force throttle (Nextcloud login page only) ---
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Drop unknown hosts (EC2 public DNS, raw IPs) to prevent bypassing Cloudflare
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    return 444;
}

server {
    listen 80;
    server_name sandeeppokharel.com.np www.sandeeppokharel.com.np portfolio.sandeeppokharel.com.np wiki.sandeeppokharel.com.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sandeeppokharel.com.np www.sandeeppokharel.com.np;

    # Cloudflare Origin Certificate (replaces Let's Encrypt)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512M;

    set $upstream_nextcloud http://nextcloud:80;

    # Rate-limit only the interactive login page/form (not login/v2 client polling)
    location ~ ^/(index\.php/)?login$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $upstream_nextcloud;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $upstream_nextcloud;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name portfolio.sandeeppokharel.com.np;

    # Cloudflare Origin Certificate (replaces Let's Encrypt)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512M;

    set $upstream_portfolio http://portfolio_app:80;

    location / {
        proxy_pass $upstream_portfolio;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name wiki.sandeeppokharel.com.np;

    # Cloudflare Origin Certificate (replaces Let's Encrypt)
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512M;

    set $upstream_arc_vault http://arc-vault:3000;

    location / {
        proxy_pass $upstream_arc_vault;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
