server {
    listen 80;
    server_name sentry.sandeeppokharel.com.np;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sentry.sandeeppokharel.com.np;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    # Security headers come from the ShiftSentry app itself (stricter CSP, XFO DENY,
    # 2-year HSTS); adding them here produced duplicate/conflicting headers.

    set $upstream_shiftsentry http://shiftsentry:3000;

    location / {
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_pass $upstream_shiftsentry;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
